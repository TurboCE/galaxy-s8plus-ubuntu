# Temporary CPU framebuffer desktop. This does not qualify Mali acceleration.
Section "Device"
    Identifier "G955NFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "G955NScreen"
    Device "G955NFramebuffer"
    DefaultDepth 24
EndSection
