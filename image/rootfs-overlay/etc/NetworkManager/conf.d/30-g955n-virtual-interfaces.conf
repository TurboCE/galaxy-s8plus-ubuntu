# The downstream driver exposes p2p0 as a legacy pseudo-Ethernet helper.
# It has no normal Ethernet DHCP peer. NM's generated wired profile kept
# retrying DHCP and delayed startup beyond the wait-online timeout.
# Match only this helper; retain wlan0, swlan0/AP and NM's Wi-Fi P2P devices.
# This per-device policy can be overridden explicitly through NM's D-Bus API.
[device-g955n-p2p-pseudo-ethernet]
match-device=interface-name:p2p0
managed=false
