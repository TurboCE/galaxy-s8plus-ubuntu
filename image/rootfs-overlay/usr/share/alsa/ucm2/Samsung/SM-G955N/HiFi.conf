# PCM progress at 48 kHz stereo is verified on normal RDMA0 -> SIFS1 -> UAIF4.
# Hardware gain is deliberately fixed at 1 (-6 dB); desktop volume is software.
# No factory calibration, firmware, boost or original EFS data is modified.

SectionVerb {
	# ACP validates the PCM after selecting the verb, before enabling Speaker.
	# DPCM needs an attached backend even for HW_PARAMS. Establish that base
	# route while muted, so profile probing cannot fail solely on a missing DAI.
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='Speaker Gain' 0"
		cset "name='ABOX Sampling Rate Out1' 48000"
		cset "name='ABOX SPUS ASRC0' On"
		cset "name='ABOX ERAP info DSM On' 1"
		cset "name='ABOX NSRC3' UAIF4"
		cset "name='ABOX SPUS OUT0' SIFS1"
		cset "name='ABOX SIFS1' 'SPUS OUT0'"
		cset "name='ABOX UAIF SPK4' SIFS1"
		cset "name='ABOX Sampling Rate Inmux0' 48000"
		cset "name='ABOX NSRC0' UAIF0"
		cset "name='ABOX SPUM ASRC1' On"
		cset "name='ABOX SIFM0' WDMA"
	]

	DisableSequence [
		cdev "hw:${CardId}"
		# Mute first, then disconnect the backend before restoring route defaults.
		cset "name='Speaker Gain' 0"
		cset "name='ABOX UAIF SPK4' RESERVED"
		cset "name='ABOX SIFS1' 'SPUS OUT0'"
		cset "name='ABOX SPUS OUT0' SIFS1"
		cset "name='ABOX NSRC3' RESERVED"
		cset "name='ABOX ERAP info DSM On' 0"
		cset "name='ABOX SPUS ASRC0' Off"
		cset "name='ABOX NSRC0' RESERVED"
		cset "name='ABOX SPUM ASRC1' Off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Mic" {
	Comment "SM-G955N internal microphone"

	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='IN3L HPF Switch' 1"
		cset "name='LHPF1 Input 1' IN3L"
		cset "name='ASRC1IN1L Input 1' LHPF1"
		cset "name='AIF1TX1 Input 1' ASRC1IN1L"
		cset "name='AIF1TX2 Input 1' ASRC1IN1L"
		cset "name='DMIC1 Switch' 1"
	]

	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='DMIC1 Switch' 0"
		cset "name='AIF1TX2 Input 1' None"
		cset "name='AIF1TX1 Input 1' None"
		cset "name='ASRC1IN1L Input 1' None"
		cset "name='LHPF1 Input 1' None"
		cset "name='IN3L HPF Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},9"
		CaptureChannels 2
		CaptureRate 48000
	}
}

SectionDevice."Speaker" {
	Comment "SM-G955N internal speaker"

	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='Speaker Gain' 1"
	]

	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='Speaker Gain' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
