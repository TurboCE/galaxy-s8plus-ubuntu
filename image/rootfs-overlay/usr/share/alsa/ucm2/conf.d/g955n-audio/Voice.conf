SectionVerb {
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='OUT3 Demux' HPOUT4"
		cset "name='IN3 OSR' 1.536MHz"
		cset "name='IN3L HPF Switch' 1"
		cset "name='AIF1TX1 Input 1' IN3L"
		cset "name='AIF1TX2 Input 1' IN3L"
	]
}

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 100
		CaptureChannels 2
		CaptureRate 48000
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='HPOUT3 Digital Switch' off,off"
		cset "name='OUT3 Demux' HPOUT4"
		cset "name='HPOUT3 Digital Volume' 92,92"
		cset "name='HPOUT3L Input 1' AIF1RX1"
		cset "name='HPOUT3L Input 2' AIF1RX2"
		cset "name='HPOUT3 Digital Switch' on,off"
	]

	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='HPOUT3 Digital Switch' off,off"
		cset "name='HPOUT3L Input 1' None"
		cset "name='HPOUT3L Input 2' None"
	]

	Value {
		PlaybackPCM "hw:${CardId},2"
		PlaybackPriority 50
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
