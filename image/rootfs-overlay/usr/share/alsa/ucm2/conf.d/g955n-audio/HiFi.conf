SectionVerb {
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='OUT3 Demux' HPOUT4"
	]
}

SectionDevice."Speaker" {
	Comment "Internal Speaker"
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='IN3L HPF Switch' 1"
		cset "name='AIF1TX1 Input 1' IN3L"
		cset "name='AIF1TX2 Input 1' IN3L"
	]

	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='AIF1TX1 Input 1' None"
		cset "name='AIF1TX2 Input 1' None"
		cset "name='IN3L HPF Switch' 0"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 100
		CaptureChannels 2
		CaptureRate 48000
	}
}
