SectionVerb {
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='OUT3 Demux' HPOUT4"
		cset "name='IN3 OSR' 1.536MHz"
		cset "name='IN3L HPF Switch' 1"
		cset "name='AIF1TX1 Input 1' IN3L"
		cset "name='AIF1TX2 Input 1' IN3L"
	]
}

SectionDevice."Speaker" {
	Comment "Bottom Speaker"
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

If.WiredHeadphones {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='Headphone Jack'"
	}
	True.SectionDevice."Headphones" {
		Comment "Wired Headphones"
		ConflictingDevice [ "Speaker" ]

		EnableSequence [
			cdev "hw:${CardId}"
			cset "name='HPOUT2 Digital Switch' off,off"
			cset "name='HPOUT2 SC Protect Switch' on"
			cset "name='HPOUT2 Digital Volume' 72,72"
			cset "name='HPOUT2L Input 1' AIF1RX1"
			cset "name='HPOUT2R Input 1' AIF1RX2"
			cset "name='HPOUT2 Digital Switch' on,on"
		]

		DisableSequence [
			cdev "hw:${CardId}"
			cset "name='HPOUT2 Digital Switch' off,off"
			cset "name='HPOUT2L Input 1' None"
			cset "name='HPOUT2R Input 1' None"
		]

		Value {
			JackControl "Headphone Jack"
			PlaybackPCM "hw:${CardId},2"
			PlaybackPriority 150
			PlaybackChannels 2
			PlaybackRate 48000
		}
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 100
		CaptureChannels 2
		CaptureRate 48000
	}
}
