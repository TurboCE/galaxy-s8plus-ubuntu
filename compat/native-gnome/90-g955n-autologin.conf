[Service]
# The mainline initramfs generates this file before starting GDM.
ExecStartPre=-/usr/bin/sed -i -e '/^[[:space:]]*AutomaticLogin[[:space:]]*=/d' -e 's/^[[:space:]]*AutomaticLoginEnable[[:space:]]*=.*/AutomaticLoginEnable=true/' -e '/^AutomaticLoginEnable=true/a AutomaticLogin=ubuntu' /run/g955n-mainline-desktop/gdm.conf
