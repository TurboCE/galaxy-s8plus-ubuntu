[Unit]
Requires=g955n-location-hub.service
After=g955n-location-hub.service systemd-tmpfiles-setup.service

[Service]
ExecStart=
ExecStartPre=/opt/g955n-sensors/prepare-ssp.py --prepare
ExecStart=/opt/g955n-sensors/libexec/iio-sensor-proxy
ExecStopPost=/opt/g955n-sensors/recover-ssp-lease.py --recover
ReadWritePaths=/run/g955n-ssp-leases /run/g955n-ssp.lock
UMask=0077
TimeoutStartSec=85
TimeoutStopSec=20
